services:
  signer:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: "none"
    restart: unless-stopped
